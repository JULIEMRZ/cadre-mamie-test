  text("noticeText",message);latestNewItem=added[0];visible("badge",true)
 }
}
for(var si=0;si<data.length;si++)seenIds[data[si].id]=true;

// Cache the signed URL while it is valid; avoid an extra network request on every slide.
function signed(path,done){

function nextPhotoIndex(index){

}

  if(!src||loadedCache[path])return;

 })
}
function showPhoto(index){
 if(!items.length)return;
 var attempts=0;
 while(attempts<items.length&&items[index%items.length].type_media!=="photo"){index++;attempts++}
 if(attempts>=items.length){visible("photo",false);visible("empty",true);text("empty","Les vidéos sont disponibles dans la galerie ❤️");return}

function previousPhotoIndex(index){
